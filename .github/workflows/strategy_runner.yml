name: Strategy Runner (multi-account)

on:
  schedule:
    - cron: '20 22 * * *'   # 22:20 UTC daily, after the legacy MR run (22:05)
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Run a single strategy (blank = all)'
        required: false
        default: ''
      dry_run:
        description: 'Dry-run: full chain (login/switch/assert/epic/candles/signal) but NO order'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      max-parallel: 1          # serialize: avoids git push races on live/ + staggers API calls
      fail-fast: false
      matrix:
        # Strategies with a pinned account, validated by dry-run. Sequenced
        # (max-parallel 1) on distinct accounts -> no collision. Others stay out.
        strategy: [gold, index]
    concurrency:
      group: strategy-${{ matrix.strategy }}   # isolated per strategy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache market data
        uses: actions/cache@v4
        with:
          path: sabo_lit/sandbox/data
          # Unique key per run: an exact-hit cache is never re-saved, so the fixed
          # v1 key froze the data at its first save and every run re-bootstrapped
          # only ~200 broker bars. run_id key -> miss -> restore latest -> save fresh.
          key: capital-daily-bars-v2-${{ github.run_id }}
          restore-keys: |
            capital-daily-bars-v2-
            capital-daily-bars-

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -r sabo_lit/sandbox/requirements.txt

      - name: Run strategy ${{ matrix.strategy }}
        if: ${{ github.event.inputs.strategy == '' || github.event.inputs.strategy == matrix.strategy }}
        env:
          # Cas A (one login, switch accountId per config): base secrets used for all.
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          CAPITAL_ENVIRONMENT: ${{ secrets.CAPITAL_ENVIRONMENT || 'demo' }}
          # Cas B (separate login per strategy): add suffixed secrets and set
          # secret_suffix in the config, e.g. CAPITAL_API_KEY_FXTSM. Uncomment:
          # CAPITAL_API_KEY_FXTSM: ${{ secrets.CAPITAL_API_KEY_FXTSM }}
          # CAPITAL_IDENTIFIER_FXTSM: ${{ secrets.CAPITAL_IDENTIFIER_FXTSM }}
          # CAPITAL_API_PASSWORD_FXTSM: ${{ secrets.CAPITAL_API_PASSWORD_FXTSM }}
          CAPITAL_API_KEY_GOLD: ${{ secrets.CAPITAL_API_KEY_GOLD }}
          CAPITAL_IDENTIFIER_GOLD: ${{ secrets.CAPITAL_IDENTIFIER_GOLD }}
          CAPITAL_API_PASSWORD_GOLD: ${{ secrets.CAPITAL_API_PASSWORD_GOLD }}
          CAPITAL_API_KEY_INDEX: ${{ secrets.CAPITAL_API_KEY_INDEX }}
          CAPITAL_IDENTIFIER_INDEX: ${{ secrets.CAPITAL_IDENTIFIER_INDEX }}
          CAPITAL_API_PASSWORD_INDEX: ${{ secrets.CAPITAL_API_PASSWORD_INDEX }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPITAL_GSL_MODE: ${{ vars.CAPITAL_GSL_MODE || 'auto' }}
          CAPITAL_GSL_DISTANCE_BUFFER: ${{ vars.CAPITAL_GSL_DISTANCE_BUFFER || '2.0' }}
          CAPITAL_GSL_FALLBACK_DISTANCE_PCT: ${{ vars.CAPITAL_GSL_FALLBACK_DISTANCE_PCT || '5.0' }}
          CAPITAL_GSL_STOPLOSS_RETRY_MULTIPLIER: ${{ vars.CAPITAL_GSL_STOPLOSS_RETRY_MULTIPLIER || '2.0' }}
          CAPITAL_GSL_ATR_MULT: ${{ vars.CAPITAL_GSL_ATR_MULT || '1.5' }}
          CAPITAL_GSL_ATR_PERIOD: ${{ vars.CAPITAL_GSL_ATR_PERIOD || '14' }}
          DAILY_DD_BREAKER_PCT: ${{ vars.DAILY_DD_BREAKER_PCT || '-2.0' }}
          MAX_PEAK_DD_PCT: ${{ vars.MAX_PEAK_DD_PCT || '-8.0' }}
          # reset = daily close+reopen (pays 1 spread/position/day).
          # skip_unchanged = hold same-side positions within 20% size tolerance —
          # validated 2026-07: gold net Sharpe 0.54->0.79, maxDD -10.2%->-7.2%.
          EXEC_REBALANCE_MODE: ${{ vars.EXEC_REBALANCE_MODE || 'reset' }}
        run: |
          cd sabo_lit/sandbox
          python strategy_runner.py --config ${{ matrix.strategy }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Render dashboard for ${{ matrix.strategy }}
        if: always()
        run: |
          cd sabo_lit/sandbox
          python local_dashboard.py --live-dir live/${{ matrix.strategy }} || echo "dashboard skipped"

      - name: Status report -> run summary
        if: always()
        run: |
          cd sabo_lit/sandbox
          {
            echo "## 📊 ${{ matrix.strategy }} — live status"
            echo '```'
            python strategy_status.py ${{ matrix.strategy }} 2>&1 || echo "(status unavailable)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit state for ${{ matrix.strategy }}
        if: always()
        run: |
          # Order matters: commit FIRST, then rebase+push with retries. The old
          # sequence pulled before adding -> unstaged live/ changes blocked the
          # rebase, then the push was rejected (previous matrix job had pushed)
          # and swallowed by "|| echo" -> index state was silently lost daily.
          git config user.email "automation@github.com"
          git config user.name "GitHub Actions Bot"
          git add -A sabo_lit/sandbox/live/${{ matrix.strategy }}/
          if git diff --staged --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "Strategy ${{ matrix.strategy }} run $(date -u +%Y-%m-%d)"
          git stash --include-untracked || true
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin ${{ github.ref_name }} && git push; then
              ok=1
              break
            fi
            sleep $((i * 5))
          done
          if [ "$ok" != "1" ]; then
            echo "::error::state push failed after 3 attempts — live/${{ matrix.strategy }} not persisted"
            exit 1
          fi

      - name: Notify failure (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            cd sabo_lit/sandbox
            python telegram_notifier.py --message "❌ Strategy ${{ matrix.strategy }} run FAILED — check GitHub Actions ($GITHUB_RUN_ID)" || true
          fi
