name: Daily Prop Firm Signal

on:
  schedule:
    # 22:05 UTC Sun-Thu only (Fri 20:59 → Sun 21:00 UTC: FX closed → skip Fri+Sat runs)
    - cron: '5 22 * * 0-4'
  workflow_dispatch:        # manual trigger button

permissions:
  contents: write           # needed to commit state files back

env:
  # GitHub Actions switches JavaScript actions from Node 20 to Node 24 in June 2026.
  # Opt in now so the 30-day demo does not change behavior mid-run.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: daily-propfirm-signal
  cancel-in-progress: false

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Capital daily bars
        uses: actions/cache@v4
        with:
          path: sabo_lit/sandbox/data
          key: capital-daily-bars-v1
          restore-keys: |
            capital-daily-bars-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas plotly quantstats requests numpy

      - name: Run daily automation
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          CAPITAL_ENVIRONMENT: ${{ secrets.CAPITAL_ENVIRONMENT || 'demo' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd sabo_lit/sandbox
          python automated_runner.py

      - name: Commit state changes
        run: |
          git config user.email "automation@github.com"
          git config user.name "GitHub Actions Bot"
          git add sabo_lit/sandbox/live/ || true
          git diff --staged --quiet || git commit -m "Daily run $(date -u +%Y-%m-%d)"
          git push || echo "Nothing to push"

      - name: Notify on failure (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            cd sabo_lit/sandbox
            python telegram_notifier.py --run-summary --status failure || \
              python telegram_notifier.py --message "❌ Sabo Quant daily run FAILED — check GitHub Actions"
          fi
