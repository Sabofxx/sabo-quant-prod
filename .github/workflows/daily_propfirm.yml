name: Daily Prop Firm Signal

on:
  schedule:
    # 22:05 UTC every day — Mon-Fri trade, Sat-Sun weekend status report (no orders)
    - cron: '5 22 * * *'
  workflow_dispatch:        # manual trigger button

permissions:
  contents: write           # needed to commit state files back

env:
  # GitHub Actions switches JavaScript actions from Node 20 to Node 24 in June 2026.
  # Opt in now so the 30-day demo does not change behavior mid-run.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: daily-propfirm-signal
  cancel-in-progress: false

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Capital daily bars
        uses: actions/cache@v4
        with:
          path: sabo_lit/sandbox/data
          key: capital-daily-bars-v1
          restore-keys: |
            capital-daily-bars-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r sabo_lit/sandbox/requirements.txt

      - name: Run daily automation
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          CAPITAL_ENVIRONMENT: ${{ secrets.CAPITAL_ENVIRONMENT || 'demo' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Tunable thresholds via repo variables (Settings → Variables → Actions)
          EXEC_MIN_NOTIONAL_USD: ${{ vars.EXEC_MIN_NOTIONAL_USD || '500' }}
          MAX_NOTIONAL_PER_ORDER_USD: ${{ vars.MAX_NOTIONAL_PER_ORDER_USD || '250000' }}
          DAILY_DD_BREAKER_PCT: ${{ vars.DAILY_DD_BREAKER_PCT || '-2.0' }}
          CAPITAL_GSL_MODE: ${{ vars.CAPITAL_GSL_MODE || 'auto' }}
          CAPITAL_GSL_DISTANCE_BUFFER: ${{ vars.CAPITAL_GSL_DISTANCE_BUFFER || '2.0' }}
          CAPITAL_GSL_FALLBACK_DISTANCE_PCT: ${{ vars.CAPITAL_GSL_FALLBACK_DISTANCE_PCT || '5.0' }}
          CAPITAL_GSL_STOPLOSS_RETRY_MULTIPLIER: ${{ vars.CAPITAL_GSL_STOPLOSS_RETRY_MULTIPLIER || '2.0' }}
          TV_FILTER_MODE: ${{ vars.TV_FILTER_MODE || 'disabled' }}
          TV_FILTER_MAX_AGE_HOURS: ${{ vars.TV_FILTER_MAX_AGE_HOURS || '24' }}
          TV_FILTER_REQUIRE_TODAY: ${{ vars.TV_FILTER_REQUIRE_TODAY || '1' }}
          TV_FILTER_TIMEFRAMES: ${{ vars.TV_FILTER_TIMEFRAMES || '' }}
          TV_FILTER_SYMBOLS: ${{ vars.TV_FILTER_SYMBOLS || 'EURUSD,GBPUSD,USDJPY,AUDUSD,NZDUSD,USDCAD' }}
          TV_FILTER_FAIL_CLOSED: ${{ vars.TV_FILTER_FAIL_CLOSED || '0' }}
          TRADINGVIEW_WORKER_URL: ${{ secrets.TRADINGVIEW_WORKER_URL }}
          TRADINGVIEW_WORKER_READ_TOKEN: ${{ secrets.TRADINGVIEW_WORKER_READ_TOKEN }}
        run: |
          cd sabo_lit/sandbox
          python automated_runner.py

      - name: Commit state changes
        if: always()
        run: |
          git config user.email "automation@github.com"
          git config user.name "GitHub Actions Bot"
          git add sabo_lit/sandbox/live/ || true
          git diff --staged --quiet || git commit -m "Daily run $(date -u +%Y-%m-%d)"
          git push || echo "Nothing to push"

      - name: Notify on failure (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            cd sabo_lit/sandbox
            python telegram_notifier.py --run-summary --status failure || \
              python telegram_notifier.py --message "❌ Sabo Quant daily run FAILED — check GitHub Actions"
          fi
